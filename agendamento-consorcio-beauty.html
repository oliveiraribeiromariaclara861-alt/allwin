<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF8F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agendamento • Consórcio Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html { background-color: #FFF8F1 !important; }
  html, body {
    background: #FFF8F1 !important;
    color: #3A2A20;
    -webkit-text-size-adjust: 100%;
    margin: 0;
    padding: 0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.55;
    padding: 0 20px 56px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  header {
    padding: 40px 4px 26px;
    text-align: center;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C15A2B;
    font-weight: 600;
    margin-bottom: 14px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.15;
    color: #2A1B12;
    margin: 0 0 12px;
  }
  header p {
    font-size: 15px;
    color: #6B5647;
    margin: 0 auto;
    max-width: 380px;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid #F2DFCE;
    border-radius: 22px;
    padding: 22px 20px 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 26px rgba(193, 90, 43, 0.07);
  }
  .top {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 15px;
  }
  .avatar {
    width: 46px; height: 46px;
    flex: 0 0 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E8813F, #C15A2B);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
  }
  .who { flex: 1; min-width: 0; }
  .who .name {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    color: #2A1B12;
  }
  .who .phone {
    font-size: 13px;
    color: #9A8676;
    font-variant-numeric: tabular-nums;
  }
  .paid {
    font-size: 12px;
    font-weight: 600;
    color: #2F7D4F;
    white-space: nowrap;
  }

  .slot {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #FDEEE1;
    color: #B4501F;
    font-size: 13.5px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .slot .dot { font-size: 15px; }

  .note {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B79A85;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .preview {
    background: #FBF4EC;
    border-radius: 14px;
    padding: 13px 15px;
    font-size: 14px;
    color: #55483D;
    margin-bottom: 16px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    background: linear-gradient(135deg, #E8813F, #C15A2B);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 6px 16px rgba(193, 90, 43, 0.28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: scale(0.98); box-shadow: 0 3px 10px rgba(193, 90, 43, 0.25); }
  .btn svg { width: 20px; height: 20px; }

  footer {
    text-align: center;
    font-size: 13px;
    color: #B79A85;
    padding-top: 12px;
  }
  footer .heart { color: #C15A2B; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Consórcio Beauty</div>
    <h1>Suas pacientes já<br>estão te esperando</h1>
    <p>Toque em cada nome pra abrir a conversa no privado já com a mensagem prontinha. O horário que cada uma passou está aqui do lado.</p>
  </header>

  <div id="cards"></div>

  <footer>Feito com <span class="heart">🧡</span> pra Dra Isadora</footer>
</div>

<script>
  const pacientes = [
    {
      nome: "Tatiely Pinheiro",
      inicial: "T",
      fone: "5534992980112",
      foneFmt: "+55 34 99298-0112",
      horario: "Melhor janela: das 13h às 15:30",
      msg: "Oi Tatiely, aqui é a Dra Isadora 🧡 Que alegria receber seu presente e já poder cuidar de você. Anotei que sua melhor janela é das 13h às 15:30, então vou reservar esse cuidado com carinho pra você. Me confirma o dia dessa semana que fica bom que eu deixo seu horário garantido?"
    },
    {
      nome: "Eduarda Albernaz",
      inicial: "E",
      fone: "5534991000019",
      foneFmt: "+55 34 99100-0019",
      horario: "Prefere: parte da manhã",
      msg: "Oi Eduarda, aqui é a Dra Isadora 🧡 Recebi seu presente com muito carinho e já quero te encaixar. Vi que a manhã é o seu melhor momento, então vou te reservar logo cedo. Me diz qual manhã dessa semana funciona pra você que eu garanto seu horário?"
    },
    {
      nome: "Yasmin Cardoso",
      inicial: "Y",
      fone: "5534999175386",
      foneFmt: "+55 34 99917-5386",
      horario: "Melhor dia: segunda (folga dela) • prioridade",
      msg: "Oi Yasmin, aqui é a Dra Isadora 🧡 Amei saber que você também vive o mundo da beleza. Já anotei que segunda é sua folga e seu melhor dia, e vou te dar prioridade nesse encaixe. Me confirma a segunda que funciona pra você que eu seguro seu horário?"
    }
  ];

  const wa = document.createElement('div');
  const zap = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.8-.9-2.1-1-.28-.1-.48-.15-.68.15-.2.3-.78.99-.96 1.19-.18.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.79-1.67-2.09-.18-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.63-.93-2.24-.24-.58-.49-.5-.67-.51h-.58c-.2 0-.52.07-.8.37-.27.3-1.05 1.03-1.05 2.5 0 1.47 1.08 2.9 1.23 3.1.15.2 2.12 3.24 5.14 4.54.72.31 1.28.5 1.71.64.72.23 1.38.2 1.9.12.58-.09 1.8-.74 2.05-1.45.25-.71.25-1.32.18-1.45-.07-.13-.27-.2-.57-.35z"/><path d="M12 2C6.48 2 2 6.48 2 12c0 1.76.46 3.42 1.27 4.86L2 22l5.28-1.38A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.09-.47-4.34-1.28l-.31-.19-3.13.82.84-3.05-.2-.32A7.94 7.94 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>`;

  wa.innerHTML = pacientes.map(p => {
    const link = "https://wa.me/" + p.fone + "?text=" + encodeURIComponent(p.msg);
    return `
      <div class="card">
        <div class="top">
          <div class="avatar">${p.inicial}</div>
          <div class="who">
            <div class="name">${p.nome}</div>
            <div class="phone">${p.foneFmt}</div>
          </div>
          <div class="paid">Presente ✓</div>
        </div>
        <div class="slot"><span class="dot">🕒</span>${p.horario}</div>
        <div class="note">Mensagem que vai enviada</div>
        <div class="preview">${p.msg}</div>
        <a class="btn" href="${link}" target="_blank" rel="noopener">${zap} Abrir conversa</a>
      </div>`;
  }).join('');

  document.getElementById('cards').appendChild(wa);
</script>
</body>
</html>
